<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote chalet – Ski mars 2027</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg-grad:linear-gradient(165deg,#e4e8ec 0%,#d7dde3 50%,#e9ecef 100%);
  --b1:#b9c4d0;--b2:#cfd3d8;--b3:#aebfc9;
  --card:rgba(255,255,255,.55);--card-border:rgba(255,255,255,.8);--shadow:0 8px 30px rgba(40,55,75,.16);
  --text:#1d2530;--muted:#5a6675;--line:rgba(29,37,48,.14);
  --accent:#3d5a78;--accent-soft:rgba(61,90,120,.12);
  --warn:#8a4b00;--warn-soft:rgba(255,190,90,.35);
  --limb:#26303c;--flake:rgba(90,110,135,.85);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-grad:linear-gradient(165deg,#0d1014 0%,#1a2028 55%,#222a33 100%);
    --b1:#34414f;--b2:#3f444c;--b3:#2c4a52;
    --card:rgba(255,255,255,.10);--card-border:rgba(255,255,255,.24);--shadow:0 8px 30px rgba(0,0,20,.35);
    --text:#eef1f5;--muted:#a7b1bd;--line:rgba(255,255,255,.16);
    --accent:#a9c3da;--accent-soft:rgba(169,195,218,.16);
    --warn:#ffcf8a;--warn-soft:rgba(255,190,90,.18);
    --limb:#e8edf2;--flake:rgba(255,255,255,.92);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-grad:linear-gradient(165deg,#0d1014 0%,#1a2028 55%,#222a33 100%);
  --b1:#34414f;--b2:#3f444c;--b3:#2c4a52;
  --card:rgba(255,255,255,.10);--card-border:rgba(255,255,255,.24);--shadow:0 8px 30px rgba(0,0,20,.35);
  --text:#eef1f5;--muted:#a7b1bd;--line:rgba(255,255,255,.16);
  --accent:#a9c3da;--accent-soft:rgba(169,195,218,.16);
  --warn:#ffcf8a;--warn-soft:rgba(255,190,90,.18);
  --limb:#e8edf2;--flake:rgba(255,255,255,.92);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--b1)}
body{margin:0;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;background:var(--bg-grad);overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg .b1{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:var(--b1)}
.bg .b2{width:60vmax;height:60vmax;right:-25vmax;top:25vh;background:var(--b2)}
.bg .b3{width:60vmax;height:60vmax;left:-10vmax;bottom:-30vmax;background:var(--b3)}
main{position:relative;z-index:3;max-width:1100px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
.hero{height:120px;background:var(--accent-soft);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.hero.withimg{height:190px;background-size:cover;background-position:center;align-items:flex-end}
.hero .ph{font-size:.85rem;display:flex;flex-direction:column;align-items:flex-start}
.hero.withimg .ph{align-self:stretch;justify-content:space-between}
.hero.withimg .ph a{background:rgba(15,20,28,.6);color:#fff;border-radius:8px;padding:4px 10px;margin-top:auto;text-decoration:none;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip{display:inline-block;background:rgba(255,255,255,.88);color:#1d2530;border-radius:8px;padding:4px 10px;font-weight:800;font-size:1rem;margin-bottom:8px;letter-spacing:.01em}
.badge{align-self:flex-start;background:linear-gradient(135deg,#3b4a5a,#5d6f82);color:#fff;font-weight:800;font-size:1.05rem;border-radius:999px;padding:6px 14px;white-space:nowrap;box-shadow:0 4px 12px rgba(30,40,55,.35)}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.name{font-size:1.15rem;font-weight:700;margin:0}
.src{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.price{background:var(--accent-soft);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px}
.price .total{font-size:1.5rem;font-weight:800}
.price .head{font-size:1.1rem;font-weight:700;color:var(--accent)}
.price .note{font-size:.8rem;color:var(--muted);margin-top:2px}
.row{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:.93rem}
.row .k{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.row .v b{font-weight:700}
.todo{color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px;font-size:.85rem;font-style:normal}
.more{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem;text-decoration:none;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(15,20,28,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <h1>Quel chalet pour 2027 ? ❄️</h1>
  <p class="sub">Choisis tes chalets préférés et vote au plus vite ! Fin des votes <b>jeudi soir</b>.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Prix et disponibilités à confirmer sur chaque annonce avant réservation.</p>
</main>

  if (!t){ t = el("div", null, ""); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.className = "show";
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.className = ""; }, 3500);
}
function openLink(e){
  var url = e.currentTarget.href;
  e.preventDefault();
  var w = null;
  try { w = window.open(url, "_blank"); } catch (x) {}
  if (w){ try { w.opener = null; } catch (x) {} return; }
  try { navigator.clipboard.writeText(url).then(function(){ toast("Lien copié, colle-le dans ton navigateur"); }, function(){ window.prompt("Copie ce lien :", url); }); }
  catch (x) { window.prompt("Copie ce lien :", url); }
}
function render(){
  var grid = document.getElementById("grid");
  grid.textContent = "";
  CHALETS.forEach(function(c){
    var card = el("article", "card");

    var hero = el("div", "hero" + (c.img ? " withimg" : ""));
    if (c.img) hero.style.backgroundImage = "linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 45%,rgba(0,0,0,.45)),url(" + IMGS[c.img] + ")";
    var ph = el("div", "ph"); ph.appendChild(el("div", "chip", c.chip));
    if (c.photos){
      var a = el("a", null, "Voir les photos →"); a.href = c.photos; a.target = "_blank"; a.rel = "noopener"; a.addEventListener("click", openLink); ph.appendChild(a);
    } else {
      
    }
    hero.appendChild(ph);
    hero.appendChild(el("div", "badge", "Vote " + (CHALETS.indexOf(c) + 1)));
    card.appendChild(hero);

    var body = el("div", "body");
    var head = el("div");
    head.appendChild(el("h2", "name", c.name));
    head.appendChild(el("p", "src", c.source));
    body.appendChild(head);

    // 1. Station
    body.appendChild(row("Station", c.station ? node(bold(c.station, c.pistes)) : todo()));

    // 2. Prix
    var price = el("div", "price");
    if (c.total){
      price.appendChild(el("div", "total", fmt(c.total) + " / semaine"));
      price.appendChild(el("div", "head", fmt(c.total / GROUP) + " par personne"));
      if (c.priceNote) price.appendChild(el("div", "note", c.priceNote));
    } else {
      price.appendChild(todo());
      price.appendChild(el("div", "head", "Total et prix par personne"));
      if (c.priceNote) price.appendChild(el("div", "note", c.priceNote));
    }
    body.appendChild(price);

    // 3. Dates
    var d = el("b", null, c.dates);
    body.appendChild(row("Dates", d));

    // 4. Emplacement
    body.appendChild(row("Pistes", c.spot ? el("span", null, c.spot) : todo()));

    // 5. Chambres
    body.appendChild(row("Chambres", c.rooms ? node(bold(c.rooms, c.roomsExtra)) : todo()));

    if (c.more) body.appendChild(el("div", "more", c.more));

    var actions = el("div", "actions");
    var link = el("a", "btn", "Voir l’annonce"); link.href = c.link; link.target = "_blank"; link.rel = "noopener"; link.addEventListener("click", openLink);
    actions.appendChild(link);
    body.appendChild(actions);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

render();

(function(){
  try {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.createElement("canvas");
    cv.setAttribute("aria-hidden", "true");
    cv.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20";
    document.body.appendChild(cv);
    var ctx = cv.getContext("2d"), W = 0, H = 0, flakes = [], color = "rgba(255,255,255,.9)";
    var clock = 0, last = 0, raf = null, n = 0;
    function make(anywhere){
      var r = 2 + Math.pow(Math.random(), 1.7) * 5;
      return { x: Math.random() * (W + 40) - 20, y: anywhere ? Math.random() * H : -12, r: r,
               vy: 0.28 + r * 0.13, ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 0.9,
               rot: Math.random() * 3.14, vr: (Math.random() - 0.5) * 0.025, type: Math.floor(Math.random() * 4), on: true, fade: false };
    }
    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var total = W < 600 ? 28 : 48;
      while (flakes.length < total){ var nf = make(true); nf.on = flakes.length < total * 0.5; flakes.push(nf); }
      flakes.length = total;
    }
    function arm(x, y, ang, r, branch){
      var dx = Math.cos(ang), dy = Math.sin(ang);
      ctx.moveTo(x, y); ctx.lineTo(x + dx * r, y + dy * r);
      if (branch){
        var bx = x + dx * r * 0.62, by = y + dy * r * 0.62, bl = r * 0.34;
        ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(ang + 0.8) * bl, by + Math.sin(ang + 0.8) * bl);
        ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(ang - 0.8) * bl, by + Math.sin(ang - 0.8) * bl);
      }
    }
    function frame(ts){
      var dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; clock += dt; n++;
      if (n % 60 === 1){
        var c = getComputedStyle(document.documentElement).getPropertyValue("--flake").trim();
        if (c) color = c;
      }
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = color; ctx.lineWidth = 1.1; ctx.lineCap = "round";
      var wind = 0.9 + Math.sin(clock * 0.35) * 0.6 + Math.sin(clock * 1.3) * 0.25;
      var inten = 0.5 + 0.3 * Math.sin(clock * 0.13) + 0.22 * Math.sin(clock * 0.41 + 1.3);
      inten = Math.max(0.08, Math.min(1, inten));
      var target = Math.round(flakes.length * inten), cur = 0, i, f;
      for (i = 0; i < flakes.length; i++) if (flakes[i].on && !flakes[i].fade) cur++;
      for (i = 0; i < flakes.length; i++){
        f = flakes[i];
        if (cur < target){
          if (f.on && f.fade){ f.fade = false; cur++; }
          else if (!f.on){ flakes[i] = make(false); flakes[i].y = -12 - Math.random() * H * 0.35; cur++; }
        } else if (cur > target && f.on && !f.fade){ f.fade = true; cur--; }
      }
      ctx.beginPath();
      for (i = 0; i < flakes.length; i++){
        f = flakes[i];
        if (!f.on) continue;
        f.y += f.vy; f.rot += f.vr;
        f.x += wind * (0.5 + f.r * 0.12) + Math.sin(f.ph + clock * f.sp) * 0.35;
        if (f.x > W + 20) f.x = -20;
        if (f.y > H + 12){
          if (f.fade){ f.on = false; f.fade = false; } else { flakes[i] = make(false); }
          continue;
        }
        var k = f.type === 2 ? 4 : (f.type === 3 ? 8 : 6), step = 6.2832 / k;
        for (var j = 0; j < k; j++){
          arm(f.x, f.y, f.rot + j * step, (f.type === 3 && j % 2) ? f.r * 0.6 : f.r, f.type === 0 || (f.type === 1 && f.r > 4));
        }
      }
      ctx.stroke();
      raf = requestAnimationFrame(frame);
    }
    resize();
    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", function(){
      if (document.hidden){ cancelAnimationFrame(raf); raf = null; }
      else if (!raf){ last = 0; raf = requestAnimationFrame(frame); }
    });
    raf = requestAnimationFrame(frame);
  } catch (e) {}
})();
